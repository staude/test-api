services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: test-app:local
    env_file: .env
    environment:
      TESTAPP_DATABASE_URL: postgres://test:${POSTGRES_PASSWORD}@db/test
    ports:
      - "${TESTAPP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
