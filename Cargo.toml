[workspace]
members = [
    "crates/test-app",
    "crates/test-client",
    "crates/test-core",
    "crates/test-db",
    "crates/test-mcp",
    "crates/test-rest",
    "crates/test-web",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Frank Staude <frank@immoticket24.de>"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
test-client = { path = "crates/test-client" }
test-core = { path = "crates/test-core" }
test-db = { path = "crates/test-db" }
test-mcp = { path = "crates/test-mcp" }
test-rest = { path = "crates/test-rest" }
test-web = { path = "crates/test-web" }

anyhow = "1"
argon2 = "0.6"
askama = "0.16"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie", "form"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
hex = "0.4"
ipnet = "2"
mime_guess = "2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
rpassword = "7"
rust-embed = "8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "6", features = ["uuid", "time", "axum_extras"] }
utoipa-scalar = { version = "0.4", features = ["axum"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
strip = true
lto = "thin"
